<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Surah - Mari Belajar Al-Qur'an</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <!-- Google Fonts: Inter & Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .font-arabic {
        font-family: "Amiri", serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white"
    x-data="detailSurahApp()"
  >
    <!-- NAVBAR -->
    <nav
      class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
          <a href="index.html" class="flex items-center space-x-3">
            <div
              class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-emerald-200"
            >
              📖
            </div>
            <span class="font-bold text-xl text-slate-900 tracking-tight"
              >Mari Belajar <span class="text-emerald-600">Alquran</span></span
            >
          </a>

          <div>
            <a
              href="surah.html"
              class="px-4 py-2.5 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition inline-flex items-center gap-2"
            >
              ← Kembali ke Daftar Surah
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- LOADING STATE -->
    <div
      x-show="loading"
      class="min-h-[60vh] flex flex-col justify-center items-center"
    >
      <div
        class="w-12 h-12 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"
      ></div>
      <p class="mt-4 text-slate-600 font-medium text-sm">
        Memuat ayat-ayat surah...
      </p>
    </div>

    <!-- KONTEN SURAH -->
    <template x-if="!loading && surah">
      <div>
        <!-- HEADER SURAH -->
        <section
          class="bg-gradient-to-b from-emerald-900 via-emerald-800 to-emerald-900 text-white py-12 sm:py-16 text-center"
        >
          <div class="max-w-4xl mx-auto px-4">
            <span
              class="px-3 py-1 bg-emerald-700/80 rounded-full text-xs font-semibold text-emerald-200 tracking-wider uppercase mb-3 inline-block"
              x-text="surah.tempatTurun === 'Mekah' ? 'Makkiyah' : 'Madaniyah'"
            ></span>
            <h1
              class="text-4xl sm:text-6xl font-extrabold mb-2"
              x-text="surah.namaLatin"
            ></h1>
            <p
              class="font-arabic text-3xl sm:text-4xl text-emerald-200 my-3"
              x-text="surah.nama"
            ></p>
            <p class="text-emerald-100 text-sm sm:text-base">
              Arti: "<span x-text="surah.arti"></span>" •
              <span x-text="surah.jumlahAyat"></span> Ayat
            </p>

            <!-- Audio Full Surah -->
            <div class="mt-6 flex justify-center">
              <audio controls class="rounded-lg shadow-lg max-w-xs w-full">
                <source
                  :src="surah.audioFull['05'] || Object.values(surah.audioFull)[0]"
                  type="audio/mpeg"
                />
              </audio>
            </div>
          </div>
        </section>

        <!-- DAFTAR AYAT -->
        <main class="max-w-4xl mx-auto px-4 sm:px-6 py-12 space-y-8">
          <!-- Bismillah (Tampil jika bukan At-Taubah / Surat 9) -->
          <template x-if="surah.nomor !== 1 && surah.nomor !== 9">
            <div
              class="text-center py-6 bg-white rounded-2xl border border-slate-200 shadow-sm"
            >
              <p class="font-arabic text-3xl text-slate-800">
                بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
              </p>
            </div>
          </template>

          <!-- Iterasi Ayat-Ayat Surah -->
          <template x-for="ayat in surah.ayat" :key="ayat.nomorAyat">
            <div
              class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-sm hover:border-emerald-500/50 transition"
            >
              <!-- Header Ayat (Nomor & Audio Per Ayat) -->
              <div
                class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100"
              >
                <div
                  class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 font-bold flex items-center justify-center text-sm shadow-sm"
                  x-text="surah.nomor + ':' + ayat.nomorAyat"
                ></div>

                <audio controls class="h-8 max-w-[200px]">
                  <source
                    :src="ayat.audio['05'] || Object.values(ayat.audio)[0]"
                    type="audio/mpeg"
                  />
                </audio>
              </div>

              <!-- Teks Arab -->
              <p
                class="font-arabic text-2xl sm:text-4xl text-right text-slate-800 leading-[2.3] sm:leading-[2.5] font-bold mb-6"
                x-text="ayat.teksArab"
              ></p>

              <!-- Transliterasi Latin -->
              <p
                class="text-emerald-700 font-medium text-xs sm:text-sm mb-3 italic"
                x-text="ayat.teksLatin"
              ></p>

              <!-- Terjemahan Indonesia -->
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                <p
                  class="text-slate-700 text-sm sm:text-base leading-relaxed"
                  x-text="ayat.teksIndonesia"
                ></p>
              </div>
            </div>
          </template>

          <!-- Tombol Navigasi Surah Sebelum & Selanjutnya -->
          <div
            class="flex justify-between items-center pt-8 border-t border-slate-200"
          >
            <template x-if="surah.suratSebelumnya">
              <a
                :href="'detail-surah.html?nomor=' + surah.suratSebelumnya.nomor"
                class="px-5 py-3 bg-white border border-slate-200 rounded-xl text-slate-700 font-semibold hover:border-emerald-600 transition text-sm"
              >
                ← <span x-text="surah.suratSebelumnya.namaLatin"></span>
              </a>
            </template>
            <template x-if="!surah.suratSebelumnya"><div></div></template>

            <template x-if="surah.suratSelanjutnya">
              <a
                :href="'detail-surah.html?nomor=' + surah.suratSelanjutnya.nomor"
                class="px-5 py-3 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 transition text-sm"
              >
                <span x-text="surah.suratSelanjutnya.namaLatin"></span> →
              </a>
            </template>
          </div>
        </main>
      </div>
    </template>

    <script>
      function detailSurahApp() {
        return {
          surah: null,
          loading: true,

          async init() {
            // 1. Membaca query parameter ?nomor= dari URL browser
            const urlParams = new URLSearchParams(window.location.search);
            const nomorSurah = urlParams.get("nomor") || 1; // Default ke Surah 1 (Al-Fatihah) jika query kosong

            try {
              // 2. Memanggil API spesifik berdasarkan nomor surah yang diklik
              const response = await fetch(
                `https://equran.id/api/v2/surat/${nomorSurah}`,
              );
              const result = await response.json();

              if (result.code === 200) {
                this.surah = result.data;
                document.title = `Surah ${this.surah.namaLatin} - Mari Belajar Al-Qur'an`;
              }
            } catch (e) {
              console.error("Gagal memuat detail ayat surah:", e);
            } finally {
              this.loading = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
