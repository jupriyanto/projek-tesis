<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Surah Al-Qur'an - Mari Belajar Al-Qur'an</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js untuk fitur pencarian & filter interaktif -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <!-- Google Fonts: Inter & Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .font-arabic {
        font-family: "Amiri", serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white"
    x-data="surahListApp()"
  >
    <!-- NAVBAR -->
    <nav
      class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
          <a href="index.html" class="flex items-center space-x-3">
            <div
              class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-emerald-200"
            >
              📖
            </div>
            <span class="font-bold text-xl text-slate-900 tracking-tight"
              >Mari Belajar <span class="text-emerald-600">Alquran</span></span
            >
          </a>

          <div
            class="hidden md:flex items-center space-x-8 font-medium text-slate-600"
          >
            <a href="index.html" class="hover:text-emerald-600 transition"
              >Beranda</a
            >
            <a
              href="dalil-alquran.html"
              class="hover:text-emerald-600 transition"
              >Dalil Al-Qur'an</a
            >
            <a href="surah.html" class="text-emerald-600 font-semibold"
              >Daftar Surah</a
            >
            <a
              href="materi-tajwid.html"
              class="hover:text-emerald-600 transition"
              >Materi Tajwid</a
            >
            <a
              href="latihan-tajwid.html"
              class="hover:text-emerald-600 transition"
              >Latihan</a
            >
          </div>

          <div>
            <a
              href="index.html"
              class="px-4 py-2.5 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition inline-flex items-center gap-2"
            >
              ← Kembali
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- HEADER & PENCARIAN -->
    <section
      class="bg-gradient-to-b from-emerald-900 via-emerald-800 to-emerald-900 text-white py-12 sm:py-16 relative overflow-hidden"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center"
      >
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4">
          Daftar Surah Al-Qur'an
        </h1>
        <p class="text-emerald-100 text-sm sm:text-base max-w-2xl mx-auto mb-8">
          Klik salah satu surah di bawah untuk membaca ayat, terjemahan, dan
          mendengarkan audio Murottal.
        </p>

        <!-- Input Pencarian -->
        <div class="max-w-2xl mx-auto relative">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"
          >
            🔍
          </div>
          <input
            type="text"
            x-model="search"
            placeholder="Cari nama surah atau nomor (contoh: Al-Fatihah, 1, Yasin)..."
            class="w-full pl-11 pr-4 py-4 rounded-2xl bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-emerald-400/50 shadow-xl transition"
          />
        </div>

        <!-- Filter Buttons -->
        <div class="flex justify-center gap-2 mt-6">
          <button
            @click="filter = 'all'"
            :class="filter === 'all' ? 'bg-white text-emerald-900 font-bold' : 'bg-emerald-800/60 text-emerald-100 hover:bg-emerald-700'"
            class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition"
          >
            Semua
          </button>
          <button
            @click="filter = 'Mekah'"
            :class="filter === 'Mekah' ? 'bg-white text-emerald-900 font-bold' : 'bg-emerald-800/60 text-emerald-100 hover:bg-emerald-700'"
            class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition"
          >
            Makkiyah
          </button>
          <button
            @click="filter = 'Madinah'"
            :class="filter === 'Madinah' ? 'bg-white text-emerald-900 font-bold' : 'bg-emerald-800/60 text-emerald-100 hover:bg-emerald-700'"
            class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition"
          >
            Madaniyah
          </button>
        </div>
      </div>
    </section>

    <!-- GRID SURAH -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <!-- Skeleton Loading -->
      <div x-show="loading" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="i in 6" :key="i">
          <div
            class="bg-white rounded-2xl p-5 border border-slate-200 animate-pulse h-32"
          ></div>
        </template>
      </div>

      <!-- Cards Container -->
      <div x-show="!loading" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="s in filteredSurahs" :key="s.nomor">
          <!-- KLIK KARTU LANGSUNG DIARAHKAN KE detail-surah.html?nomor=X -->
          <a
            :href="'detail-surah.html?nomor=' + s.nomor"
            class="bg-white rounded-2xl p-5 border border-slate-200/80 hover:border-emerald-500 hover:shadow-xl transition group relative flex flex-col justify-between cursor-pointer"
          >
            <div>
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                  <div
                    class="w-11 h-11 rounded-xl bg-emerald-50 group-hover:bg-emerald-600 text-emerald-700 group-hover:text-white font-bold flex items-center justify-center transition shadow-sm"
                    x-text="s.nomor"
                  ></div>
                  <div>
                    <h3
                      class="font-bold text-lg text-slate-900 group-hover:text-emerald-600 transition"
                      x-text="s.namaLatin"
                    ></h3>
                    <p class="text-xs text-slate-500" x-text="s.arti"></p>
                  </div>
                </div>
                <span
                  class="font-arabic text-2xl font-bold text-slate-800"
                  x-text="s.nama"
                ></span>
              </div>
            </div>

            <div
              class="pt-4 border-t border-slate-100 flex items-center justify-between mt-2"
            >
              <div
                class="flex items-center space-x-2 text-xs text-slate-500 font-medium"
              >
                <span
                  class="px-2 py-0.5 rounded bg-slate-100 text-slate-600"
                  x-text="s.tempatTurun === 'Mekah' ? 'Makkiyah' : 'Madaniyah'"
                ></span>
                <span>•</span>
                <span x-text="s.jumlahAyat + ' Ayat'"></span>
              </div>
              <span
                class="inline-flex items-center text-xs font-semibold text-emerald-600 group-hover:text-emerald-700 group-hover:translate-x-1 transition"
              >
                Baca Surah &rarr;
              </span>
            </div>
          </a>
        </template>
      </div>
    </main>

    <script>
      function surahListApp() {
        return {
          search: "",
          filter: "all",
          surahs: [],
          loading: true,

          async init() {
            try {
              // Mengambil daftar 114 Surah dari API
              const response = await fetch("https://equran.id/api/v2/surat");
              const result = await response.json();
              this.surahs = result.data;
            } catch (error) {
              console.error("Gagal mengambil daftar surah:", error);
            } finally {
              this.loading = false;
            }
          },

          get filteredSurahs() {
            return this.surahs.filter((s) => {
              const matchFilter =
                this.filter === "all" || s.tempatTurun === this.filter;
              const matchSearch =
                s.namaLatin.toLowerCase().includes(this.search.toLowerCase()) ||
                s.nomor.toString().includes(this.search);
              return matchFilter && matchSearch;
            });
          },
        };
      }
    </script>
  </body>
</html>
